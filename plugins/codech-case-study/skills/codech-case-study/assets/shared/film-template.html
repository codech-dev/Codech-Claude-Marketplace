<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Case study film</title>
<!-- Codech case-study film stage (generated by build_case.py from case.json; lives in work/<slug>/_film/, never deployed).
     ?fmt=wide (1920x1080) | ?fmt=social (1080x1350). record_film.py calls startFilm(); window.FILM_DONE turns true at the end.
     Open it without ?rec to preview in a browser. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../../_shared/ov.css">
<link rel="stylesheet" href="../assets/scenes.css">
<style>
*{box-sizing:border-box}
:root{--th-deep:#061525;--th-mid:#0b1f35;--th-end:#12365f;--th-glow:#2451b8;/*__THEME__*/}
html,body{margin:0;background:var(--th-deep);overflow:hidden}
.film{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:#fff;
  background:radial-gradient(70% 90% at 90% 100%,var(--th-glow) 0%,transparent 60%),radial-gradient(50% 60% at 0% 0%,rgba(212,184,149,.14),transparent 70%),linear-gradient(155deg,var(--th-deep) 0%,var(--th-mid) 50%,var(--th-end) 100%)}
.film::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(90% 90% at 50% 40%,#000,transparent);-webkit-mask-image:radial-gradient(90% 90% at 50% 40%,#000,transparent)}
.fm-layer{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.fm-layer.on{opacity:1}
.fm-top{position:absolute;left:96px;right:96px;top:44px;display:flex;align-items:center;justify-content:space-between;z-index:5;transition:opacity .6s}
.fm-top img{height:84px;width:auto}
.fm-top span{font:500 15px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.fm-logo-chip{display:inline-flex;padding:14px 20px;background:#fff;border-radius:20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.fm-logo-chip img{height:64px;width:auto;display:block}

/* intro + outro */
.fm-center{display:grid;place-items:center;align-content:center;text-align:center;gap:26px}
.fm-center h1{margin:0;font-size:104px;line-height:1;letter-spacing:-.05em;font-weight:800}
.fm-center h1 em{font-style:normal;color:#6fa8ff}
.fm-center p{margin:0;font-size:32px;color:rgba(255,255,255,.75);font-weight:600;letter-spacing:-.01em}
.fm-by{font:500 17px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.fm-stats{display:flex;gap:80px;margin-top:10px}
.fm-stats div{text-align:center}
.fm-stats b{display:block;font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:1}
.fm-stats span{display:block;margin-top:12px;font-size:22px;color:rgba(255,255,255,.65);font-weight:600}
.fm-cta{display:inline-flex;align-items:center;gap:14px;height:74px;padding:0 34px;border-radius:18px;background:#fff;color:#0b0d12;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:18px}
.pop-in{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .8s cubic-bezier(.22,.8,.2,1)}
.on .pop-in{opacity:1;transform:none}
.on .d1{transition-delay:.15s}.on .d2{transition-delay:.3s}.on .d3{transition-delay:.5s}.on .d4{transition-delay:.8s}

/* scenes */
.fm-txt{position:absolute;left:110px;top:300px;width:520px}
.fm-grp{display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 8px 0 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:17px;font-weight:700}
.fm-grp i{font:500 13px/1 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;font-style:normal;padding:7px 10px;border-radius:999px}
.fm-grp i.live{background:#DDF4EA;color:#1E9E6A}
.fm-grp i.build{background:#FEF3C7;color:#B45309}
.fm-num{margin-top:40px;font:500 18px/1 "JetBrains Mono",monospace;color:rgba(255,255,255,.5);letter-spacing:.08em}
.fm-cap{margin-top:16px;font-size:60px;line-height:1.04;letter-spacing:-.045em;font-weight:800}
.fm-sub{margin-top:22px;font-size:25px;line-height:1.45;color:rgba(255,255,255,.72);font-weight:600}
.fm-txt > *{transition:opacity .45s ease,transform .6s cubic-bezier(.22,.8,.2,1)}
.fm-txt.swap > *{opacity:0;transform:translateY(12px)}
.fm-view{position:absolute;left:690px;top:150px;width:1140px}
.fm-view .sizer{aspect-ratio:600/420}
.fm-view .ov{position:absolute;inset:0;opacity:0;transform:scale(.97);transition:opacity .6s ease,transform .9s cubic-bezier(.22,.8,.2,1)}
.fm-view .ov.on{opacity:1;transform:none}
.fm-prog{position:absolute;left:110px;right:90px;bottom:64px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.fm-prog div{display:grid;gap:12px;font-size:16px;font-weight:700;color:rgba(255,255,255,.45);transition:color .3s}
.fm-prog div i{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.fm-prog div i b{display:block;height:100%;width:0;background:#6fa8ff}
.fm-prog div.on{color:#fff}
.fm-prog div.done i b{width:100%}

/* end card: logo with a gold ring drawing in, contact details and a WhatsApp QR (film.end_card) */
.fm-end{display:grid;place-items:center;align-content:center;text-align:center}
.fm-end .lg{position:relative;width:300px;height:300px;display:grid;place-items:center}
.fm-end .lg::before{content:"";position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(closest-side,rgba(242,180,140,.36),rgba(212,184,149,.12) 55%,transparent);opacity:0;transform:scale(.6);transition:opacity 1.2s ease .3s,transform 1.6s cubic-bezier(.22,.8,.2,1) .3s}
.fm-end .lg svg.ring{position:absolute;inset:0;width:300px;height:300px;transform:rotate(-90deg)}
.fm-end .lg svg.ring circle{fill:none;stroke:url(#endRing);stroke-width:5;stroke-linecap:round;stroke-dasharray:893;stroke-dashoffset:893;transition:stroke-dashoffset 1.5s cubic-bezier(.65,0,.35,1) .2s}
.fm-end .lg img{position:relative;height:150px;width:auto;opacity:0;transform:scale(.72);filter:blur(10px);transition:opacity .8s ease .5s,transform 1.1s cubic-bezier(.22,.8,.2,1) .5s,filter .8s ease .5s}
.fm-end.on .lg::before{opacity:1;transform:none;animation:endGlow 3.2s ease-in-out 1.8s infinite}
.fm-end.on .lg svg.ring circle{stroke-dashoffset:0}
.fm-end.on .lg img{opacity:1;transform:none;filter:none}
@keyframes endGlow{50%{transform:scale(1.08);opacity:.7}}
.fm-end h2{margin:26px 0 0;font-size:64px;line-height:1.05;letter-spacing:-.045em;font-weight:800}
.fm-end h2 em{font-style:normal;background:linear-gradient(135deg,#D4B895,#F6D2BE 55%,#F2B48C);-webkit-background-clip:text;background-clip:text;color:transparent}
.fm-end .row{display:flex;align-items:center;gap:56px;margin-top:44px;text-align:left}
.fm-end .ct{display:grid;gap:22px}
.fm-end .ct > div{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700;letter-spacing:-.01em}
.fm-end .ct .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);flex:none}
.fm-end .ct .ic.wa{background:#25D366;border-color:#25D366}
.fm-end .ct .ic svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fm-end .ct small{display:block;font:500 15px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:8px}
.fm-end .qr{background:#fff;border-radius:26px;padding:22px 22px 16px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7),0 0 0 6px rgba(212,184,149,.35)}
.fm-end .qr svg{display:block;width:230px;height:230px}
.fm-end .qr span{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:17px;font-weight:800;color:#0b0d12}
.fm-end .qr span i{width:10px;height:10px;border-radius:50%;background:#25D366}
.fm-top.hide{opacity:0}
.social .fm-end .row{flex-direction:column;gap:40px}
.social .fm-end h2{font-size:58px;padding:0 60px}

/* social 1080x1350 */
.social .film{width:1080px;height:1350px}
.social .fm-top{left:64px;right:64px;top:48px}
.social .fm-top img{height:72px}
.social .fm-txt{left:64px;right:64px;top:150px;width:auto}
.social .fm-num{margin-top:28px}
.social .fm-cap{font-size:58px}
.social .fm-sub{font-size:25px}
.social .fm-view{left:40px;width:1000px;top:560px}
.social .fm-prog{left:64px;right:64px;bottom:52px;grid-template-columns:repeat(3,1fr)}
.social .fm-center h1{font-size:92px}
.social .fm-center p{font-size:30px;padding:0 60px}
.social .fm-stats{flex-direction:column;gap:40px}
</style>
</head>
<body>
<div class="film" id="film">
  <div class="fm-top"><img src="../../../codech-logo.png" alt="Codech"><span id="topLbl"></span></div>

  <section class="fm-layer fm-center" id="intro">
    <span class="fm-logo-chip pop-in" id="logoChip"><img id="logo" alt=""></span>
    <h1 class="pop-in d1" id="title"></h1>
    <p class="pop-in d2" id="tagline"></p>
    <span class="fm-by pop-in d3">Designed &amp; built by Codech</span>
  </section>

  <section class="fm-layer" id="scenes">
    <div class="fm-txt" id="txt"><span class="fm-grp" id="grp"></span><div class="fm-num" id="num"></div><div class="fm-cap" id="cap"></div><div class="fm-sub" id="sub"></div></div>
    <div class="fm-view" id="view"><div class="sizer"></div></div>
    <div class="fm-prog" id="prog"></div>
  </section>

  <section class="fm-layer fm-center" id="outro">
    <div class="fm-stats" id="stats"></div>
    <p class="pop-in d3" style="margin-top:34px" id="outroLine"></p>
    <span class="fm-cta pop-in d4" id="outroCta"></span>
  </section>

  <section class="fm-layer fm-end" id="endCard">
    <div class="lg"><svg class="ring" viewBox="0 0 300 300"><defs><linearGradient id="endRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4B895"/><stop offset=".55" stop-color="#F6D2BE"/><stop offset="1" stop-color="#F2B48C"/></linearGradient></defs><circle cx="150" cy="150" r="142"/></svg><img src="../../../codech-logo.png" alt="Codech"></div>
    <h2 class="pop-in d2" id="endLine"></h2>
    <div class="row">
      <div class="ct pop-in d3" id="endCt"></div>
      <div class="qr pop-in d4" id="endQr"></div>
    </div>
  </section>
</div>

<script src="../../_shared/ov.js"></script>
<script src="../assets/scenes.js"></script>
<script>
(() => {
  const D = /*__FILM_DATA__*/null;
  const P = new URLSearchParams(location.search), social = P.get('fmt') === 'social';
  if (social) document.documentElement.classList.add('social');
  window.OV_SPEED = +(P.get('speed') || (social ? 1.3 : 1.2));
  const $ = s => document.querySelector(s);
  const words = D.product.split(' ');
  $('#topLbl').textContent = 'Case study · ' + D.product;
  $('#title').innerHTML = words.length > 1 ? `${words[0]} <em>${words.slice(1).join(' ')}</em>` : D.product;
  $('#tagline').textContent = D.tagline;
  if (D.logo) { $('#logo').src = D.logo; } else { $('#logoChip').remove(); }
  $('#stats').innerHTML = D.outroStats.map(([v, l], i) => `<div class="pop-in${i ? ' d' + i : ''}"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#outroLine').textContent = D.outroLine; $('#outroCta').textContent = D.outroCta;
  if (!D.outroLine) $('#outroLine').remove();
  const E = D.endCard;
  if (E) {
    const I = { mail: '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
                phone: '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' };
    $('#endLine').innerHTML = E.line || "Let's build <em>yours.</em>";
    $('#endCt').innerHTML = (E.email ? `<div><span class="ic">${I.mail}</span><span><small>Email</small>${E.email}</span></div>` : '')
      + (E.phone ? `<div><span class="ic wa">${I.phone}</span><span><small>Call / WhatsApp</small>${E.phone}</span></div>` : '');
    if (E.qr) $('#endQr').innerHTML = E.qr + `<span><i></i>${E.qr_label || 'Scan to chat on WhatsApp'}</span>`; else $('#endQr').remove();
  } else $('#endCard').remove();

  const S = social ? D.scenes.filter(s => D.social.includes(s.scene)) : D.scenes;
  const view = $('#view'), prog = $('#prog'), txt = $('#txt');
  prog.style.gridTemplateColumns = `repeat(${S.length},1fr)`;
  S.forEach(s => {
    view.insertAdjacentHTML('beforeend', `<div data-ov="${s.ov}"></div>`);
    prog.insertAdjacentHTML('beforeend', `<div><span>${s.label}</span><i><b></b></i></div>`);
  });
  const panes = [...view.querySelectorAll('[data-ov]')].map(el => (OV.mount(el), el));
  const bars = [...prog.children];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const on = (id, v = true) => $(id).classList.toggle('on', v);

  async function run() {
    window.FILM_DONE = false; const mark = k => (window.FILM_MARKS = window.FILM_MARKS || []).push({ k, t: Date.now() / 1000 });
    mark('intro'); on('#intro'); await sleep(3600); on('#intro', false); await sleep(400);
    on('#scenes');
    for (let k = 0; k < S.length; k++) {
      const s = S[k];
      txt.classList.add('swap'); await sleep(k ? 350 : 0);
      $('#grp').innerHTML = `${s.group}<i class="${s.status === 'live' ? 'live' : 'build'}">${s.status === 'live' ? 'Live' : 'In build'}</i>`;
      $('#num').textContent = String(k + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0');
      $('#cap').textContent = s.cap; $('#sub').textContent = s.sub;
      txt.classList.remove('swap');
      panes.forEach((p, n) => p.classList.toggle('on', n === k)); mark('scene');
      bars.forEach((b, n) => { b.classList.toggle('on', n === k); b.classList.toggle('done', n < k); });
      const bar = bars[k].querySelector('b'), t0 = performance.now();
      let raf; const tick = () => { bar.style.width = Math.min(97, (performance.now() - t0) / 150) + '%'; raf = requestAnimationFrame(tick); }; tick();
      await sleep(500);
      await panes[k]._ov.once();
      cancelAnimationFrame(raf); bar.style.width = '100%'; bars[k].classList.add('done');
    }
    await sleep(200);
    on('#scenes', false); await sleep(500);
    mark('outro'); on('#outro'); await sleep(5200);
    if (E) { on('#outro', false); await sleep(450); $('.fm-top').classList.add('hide'); mark('endcard'); on('#endCard'); await sleep(6500); }
    mark('end');
    window.FILM_DONE = true;
  }
  window.startFilm = run;
  if (!P.has('rec')) run();
})();
</script>
</body>
</html>
